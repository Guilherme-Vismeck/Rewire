name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pandas numpy scipy statsmodels networkx

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: nf-core/setup-nextflow@v2

      - name: Run pipeline on synthetic data
        run: nextflow run main.nf -profile test

      - name: Check against known truth
        run: |
          python tests/check_truth.py \
            --edges results/test/differential_network/differential_edges.tsv \
            --truth data/example/truth.tsv

      - name: Check topology and neighbor turnover
        run: |
          python tests/check_topology.py \
            --turnover results/test/rewiring/neighbor_turnover.tsv \
            --metrics results/test/topology/network_metrics.tsv

      - name: Check bootstrap and stable rewiring
        run: |
          python tests/check_bootstrap.py \
            --stable results/test/rewiring/stable_rewiring.tsv \
            --edge_stability results/test/bootstrap/edge_stability.tsv
